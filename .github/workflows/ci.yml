name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --all-groups
      - name: Tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Bandit
        run: uv run bandit -q -r src
      - name: Pip audit
        run: uv run pip-audit
      - name: License allowlist
        run: uv run python scripts/check_licenses.py
      - name: Secret scan
        run: uv run python scripts/scan_secrets.py
